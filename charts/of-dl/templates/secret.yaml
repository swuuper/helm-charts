apiVersion: v1
kind: Secret
metadata:
  name: {{ include "of-dl.fullname" . }}-auth
  labels:
    {{- include "of-dl.labels" . | nindent 4 }}
type: Opaque
stringData:
  auth.json: |-
{{ .Values.auth | toPrettyJson | indent 4 }}
{{- if and (not .Values.cdm.existingSecret) (include "of-dl.hasCdm" .) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "of-dl.cdmSecretName" . }}
  labels:
    {{- include "of-dl.labels" . | nindent 4 }}
type: Opaque
# Already-base64 key material goes straight into `data`, so the files appear
# decoded when the Secret is mounted.
data:
  device_client_id_blob: {{ .Values.cdm.deviceClientIdBlob | quote }}
  device_private_key: {{ .Values.cdm.devicePrivateKey | quote }}
{{- end }}
